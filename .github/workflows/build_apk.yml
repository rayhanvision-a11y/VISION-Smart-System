name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build_apk.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build APK
        run: |
          cd mobile_app
          flutter build apk --release --no-tree-shake-icons

      - name: Copy Named APK
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/VISION-Smart-System.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-smart-system-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "VISION Smart System APK (Direct Download)"
          body: "Official Android APK build for VISION Smart System. Download VISION-Smart-System.apk directly without extracting."
          draft: false
          prerelease: false
          files: |
            mobile_app/build/app/outputs/flutter-apk/VISION-Smart-System.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
