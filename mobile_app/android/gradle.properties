org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Suppress AAR metadata compileSdk check when a transitive dependency requires a higher
# compileSdk than the project. This avoids the ':app:checkReleaseAarMetadata' failure
# while we ensure compileSdk/AGP/Gradle versions are aligned with plugins.
android.suppressUnsupportedCompileSdk=true
